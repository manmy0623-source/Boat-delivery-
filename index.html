<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F26">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Boat delivery</title></head><body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: a full-screen map with a bottom sheet that changes by trip stage, the way ride apps work. Nile teal for route and state, ink-black for the main action. */
:root{
  --bg:#EEF2F1; --surface:#FFFFFF; --ink:#0B1F26; --muted:#5A6F75; --line:#DCE5E4;
  --accent:#0B7A80; --accent-ink:#FFFFFF; --btn:#0B1F26; --btn-ink:#FFFFFF; --sun:#E59A2F; --sun-ink:#1B1204;
  --water:#8CCBCD; --land:#E4E0D2; --me:#2563EB; --danger:#B3261E; --halo:#F1EEE4; --shadow:rgba(10,31,38,.22);
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',system-ui,sans-serif;
  --font-body:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#061A20; --surface:#0E2830; --ink:#E8F2F1; --muted:#8FA9AD; --line:#1E4650;
    --accent:#4FC3C8; --accent-ink:#04252A; --btn:#E8F2F1; --btn-ink:#0B1F26; --sun:#F0A93E; --sun-ink:#1B1204;
    --water:#1B5E68; --land:#12323A; --me:#7FB0FF; --danger:#FF8A80; --halo:#12323A; --shadow:rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#061A20; --surface:#0E2830; --ink:#E8F2F1; --muted:#8FA9AD; --line:#1E4650;
  --accent:#4FC3C8; --accent-ink:#04252A; --btn:#E8F2F1; --btn-ink:#0B1F26; --sun:#F0A93E; --sun-ink:#1B1204;
  --water:#1B5E68; --land:#12323A; --me:#7FB0FF; --danger:#FF8A80; --halo:#12323A; --shadow:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;line-height:1.25;text-wrap:balance}
p{margin:0}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[dir=rtl] svg.flip{transform:scaleX(-1)}
.ltr{direction:ltr;text-align:start}
html[dir=rtl] .ltr{text-align:right}

#app{position:relative;height:100%;max-width:520px;margin-inline:auto;overflow:hidden;background:var(--land);box-shadow:0 0 40px var(--shadow)}
#map{position:absolute;inset:0}
#map svg{display:block;width:100%;height:100%;direction:ltr;touch-action:manipulation}
.pin{cursor:pointer}
.m-label{fill:var(--ink);stroke:var(--halo);stroke-width:3.5px;paint-order:stroke;font:600 12px var(--font-body)}
.m-dest-label{font-weight:700;font-size:13px}
@keyframes pulse{0%{transform:scale(.4);opacity:.55}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:no-preference){.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}.radar{animation:pulse 1.4s ease-out infinite;transform-box:fill-box;transform-origin:center}}

.fab{position:absolute;width:46px;height:46px;border-radius:50%;background:var(--surface);color:var(--ink);box-shadow:0 2px 10px var(--shadow);display:grid;place-items:center;border:0;cursor:pointer;z-index:6}
#menuBtn{top:12px;inset-inline-start:12px}
#langBtn{top:12px;inset-inline-end:12px;width:auto;border-radius:23px;padding-inline:16px;font-weight:600}
#locBtn{top:-58px;inset-inline-end:12px}
#dock{position:absolute;inset-inline:0;bottom:0;z-index:5}
.sheet{background:var(--surface);border-radius:22px 22px 0 0;box-shadow:0 -6px 24px var(--shadow);padding:6px 16px 18px;max-height:74vh;overflow-y:auto;overscroll-behavior:contain}
.sheet.tall{max-height:88vh;min-height:62vh}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 14px}
.sub{font-size:.95rem;color:var(--muted);margin:16px 0 4px;font-family:var(--font-body);font-weight:500}
.where{width:100%;min-height:56px;border:0;border-radius:14px;background:var(--bg);display:flex;align-items:center;gap:12px;padding-inline:16px;font-size:1.15rem;font-weight:600;cursor:pointer;text-align:start}
.pick-row{width:100%;display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 4px 4px;cursor:pointer;text-align:start}
.pick-row span{flex:1;min-width:0;display:flex;flex-direction:column}
.pick-row small,.plist small,.ride small{color:var(--muted);font-size:.85rem}
.dot-me{width:14px;height:14px;border-radius:50%;background:var(--me);box-shadow:0 0 0 5px color-mix(in srgb,var(--me) 25%,transparent);flex:none;margin-inline:13px 13px}
.plist{list-style:none;margin:0;padding:0}
.plist li+li{border-top:1px solid var(--line)}
.plist button{width:100%;display:flex;gap:14px;align-items:center;padding:12px 4px;border:0;background:none;text-align:start;cursor:pointer;min-height:56px}
.plist button span.t{flex:1;min-width:0;display:flex;flex-direction:column}
.ico{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;flex:none}
.empty{color:var(--muted);padding:18px 4px}
.sh-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sh-head h3{flex:1;font-size:1.2rem}
.sh-head .sm{color:var(--muted);font-size:.9rem;font-family:var(--font-body)}
.round{width:40px;height:40px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;cursor:pointer;flex:none}
.field-in{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;background:var(--bg);padding:0 14px;font-size:16px}
.field-in:focus{border-color:var(--ink);outline:none}
.route-pair{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.rp{display:flex;align-items:center;gap:12px;min-height:46px;padding-inline:12px;border-radius:12px;background:var(--bg);border:0;width:100%;text-align:start;cursor:pointer}
.rp b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sq{width:12px;height:12px;background:var(--ink);flex:none;margin-inline:1px}
.rides{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.ride{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:14px;border:2px solid transparent;background:none;text-align:start;cursor:pointer}
.ride[aria-pressed=true]{border-color:var(--ink);background:var(--bg)}
.ride[disabled]{opacity:.5;cursor:not-allowed}
.ride .bi{width:64px;height:44px;flex:none;color:var(--ink)}
.ride .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.ride .tx b{font-size:1.02rem}
.ride .pr{font-family:var(--font-display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.sizes{display:flex;gap:8px;margin:8px 0}
.sizes button{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);background:none;cursor:pointer;font-weight:500;font-size:.88rem}
.sizes button[aria-pressed=true]{border-color:var(--ink);background:var(--bg)}
.pay-row{width:100%;display:flex;align-items:center;gap:12px;min-height:52px;border:0;border-top:1px solid var(--line);background:none;padding:6px 4px;margin-top:8px;cursor:pointer;text-align:start}
.pay-row span{flex:1}
.cta{width:100%;min-height:54px;border-radius:14px;background:var(--btn);color:var(--btn-ink);border:0;font-size:1.05rem;font-weight:600;cursor:pointer;margin-top:10px}
.cta.alt{background:var(--bg);color:var(--ink)}
.cta[disabled]{opacity:.45;cursor:not-allowed}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:6px 8px}
.center{text-align:center}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--ink);margin:10px auto 14px}
@media (prefers-reduced-motion:no-preference){.spin{animation:rot 1s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}}
.eta-big{font-family:var(--font-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:var(--accent);width:0}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .4s linear}}
.cap-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--bg)}
.avatar{width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--font-display);font-size:1.3rem;flex:none}
.cap-card .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.cap-card small{color:var(--muted)}
.plate{font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;border:1.5px solid var(--ink);border-radius:8px;padding:2px 10px;font-size:.88rem}
.rate-inline{display:inline-flex;align-items:center;gap:4px}
.rate-inline svg{width:14px;height:14px;fill:var(--sun);stroke:none}
.acts{display:flex;gap:10px;margin-top:12px}
.acts button{flex:1;min-height:48px;border-radius:12px;border:0;background:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;cursor:pointer}
.acts button.danger{color:var(--danger)}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick button{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:none;cursor:pointer}
.banner{border-radius:14px;padding:14px 16px;background:var(--accent);color:var(--accent-ink);margin-bottom:12px}
.banner h3{font-size:1.25rem}
.pin-code{font-family:var(--font-display);font-size:2.4rem;letter-spacing:.3em;direction:ltr;text-align:center;padding:10px;border:2px dashed var(--ink);border-radius:14px;margin:12px 0}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 12px;margin:10px 0 0}
.stats dt{color:var(--muted)}
.stats dd{margin:0;text-align:end;font-weight:600;font-variant-numeric:tabular-nums}
.stats .tot dt,.stats .tot dd{font-size:1.15rem;color:var(--ink);padding-top:8px;border-top:1px dashed var(--line)}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 12px}
.stars button{border:0;background:none;cursor:pointer;padding:4px}
.stars svg{width:38px;height:38px;fill:none;stroke:var(--muted);stroke-width:1.6}
.stars button[aria-pressed=true] svg{fill:var(--sun);stroke:var(--sun)}
.tips{display:flex;gap:8px;margin:8px 0}
.tips button{flex:1;min-height:44px;border-radius:12px;border:2px solid var(--line);background:none;cursor:pointer;font-weight:600}
.tips button[aria-pressed=true]{border-color:var(--ink);background:var(--bg)}
.note{font-size:.82rem;color:var(--muted);margin-top:12px;text-align:center}

#drawer{position:absolute;inset:0;z-index:30}
#drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);border:0;width:100%;cursor:pointer}
#drawer .panel{position:absolute;inset-block:0;inset-inline-start:0;width:84%;max-width:340px;background:var(--surface);padding:20px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 30px var(--shadow)}
.dr-head{display:flex;align-items:center;gap:12px;padding-bottom:16px;margin-bottom:8px;border-bottom:1px solid var(--line);direction:ltr}
.dr-head b{font-family:var(--font-display);font-size:1.3rem}
.logo{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none}
.logo img,.logo svg{width:100%;height:100%;object-fit:cover;display:block}
.dr-item{display:flex;align-items:center;gap:14px;min-height:52px;border:0;background:none;width:100%;text-align:start;cursor:pointer;font-weight:500;border-radius:12px;padding-inline:8px}
.dr-item:hover{background:var(--bg)}
.dr-foot{margin-top:auto;color:var(--muted);font-size:.85rem}
.dr-foot button{border:0;background:none;color:var(--accent);cursor:pointer;padding:6px 0;font-weight:600}
#modal{position:absolute;inset:0;z-index:40;background:var(--surface);display:flex;flex-direction:column}
.mh{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mh h3{flex:1;font-size:1.2rem}
.mb{flex:1;overflow-y:auto;padding:16px}
.demo{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--sun) 20%,transparent);font-size:.88rem;margin-bottom:14px}
.pm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.pm-row{width:100%;display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 12px;border-radius:14px;border:2px solid var(--line);background:none;text-align:start;cursor:pointer}
.pm-row[aria-pressed=true]{border-color:var(--ink)}
.pm-row .tx{flex:1;display:flex;flex-direction:column;min-width:0}
.pm-row small{color:var(--muted)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.pm-row[aria-pressed=true] .radio{border:6px solid var(--ink)}
.pm-form{display:flex;flex-direction:column;gap:10px;padding:12px 4px 4px}
.pm-form .two{display:flex;gap:10px}
.pm-form .two>*{flex:1;min-width:0}
.pm-form label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--muted);font-weight:500}
.err{color:var(--danger);font-size:.9rem;min-height:1.3em}
.trip-item{padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center}
.trip-item .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.trip-item small{color:var(--muted)}
.trip-item .pr{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#toast{position:absolute;inset-inline:16px;top:70px;z-index:70;background:var(--btn);color:var(--btn-ink);padding:10px 14px;border-radius:12px;text-align:center;box-shadow:0 4px 16px var(--shadow)}
#splash{position:absolute;inset:0;z-index:60;background:#0B1F26;color:#fff;cursor:pointer}
#splash .sp-img{position:absolute;inset:0}
#splash .sp-img svg,#splash .sp-img img{width:100%;height:100%;object-fit:cover;display:block}
#splash .sp-in{position:absolute;inset-inline:0;bottom:0;padding:60px 24px 40px;background:linear-gradient(transparent,rgba(4,20,26,.88));display:flex;flex-direction:column;gap:10px}
#splash h1{font-size:2.4rem;direction:ltr;text-align:start}
html[dir=rtl] #splash h1{text-align:right}
#splash p{opacity:.9;font-size:1.05rem}
@media (prefers-reduced-motion:no-preference){#splash.out{opacity:0;transition:opacity .5s}}

/* admin */
#adminRoot{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:100;padding-inline:16px}
#adminRoot[hidden]{display:none}
.wrap{max-width:1000px;margin-inline:auto}
.adm{padding-block:8px 40px}
.adm h2{font-size:1.4rem}
.adm .hint{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500;color:var(--muted)}
.input{width:100%;min-height:46px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);font-weight:600}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.adm-bar{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.adm-bar .l,.adm-bar .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge-s{font-size:.82rem;padding:3px 10px;border-radius:99px;background:var(--line)}
.badge-s.warn{background:color-mix(in srgb,var(--sun) 35%,transparent)}
.adm-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.adm-tabs button{min-height:42px;padding:6px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:500}
.adm-tabs button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pt-h b{font-family:var(--font-display);font-size:1.2rem;color:var(--accent)}
.trow{padding:12px 0;border-top:1px solid var(--line)}
.trow code{display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px;direction:ltr;text-align:start}
.trow textarea.input{resize:vertical;min-height:46px}
.imgs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.imgprev{aspect-ratio:4/3;border-radius:12px;background:var(--line);display:grid;place-items:center;overflow:hidden;color:var(--muted);font-size:.9rem;margin:10px 0}
.imgprev img{width:100%;height:100%;object-fit:cover}
.up{position:relative;overflow:hidden}
.up:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.chk{display:flex;align-items:center;gap:10px;min-height:44px}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.msg{min-height:1.5em;font-size:.95rem;margin-bottom:10px}
.msg.bad{color:var(--danger)}
.msg.ok{color:var(--accent)}
.login{max-width:420px;margin:40px auto}
@media (max-width:640px){.grid2,.imgs{grid-template-columns:minmax(0,1fr)}}
#app [hidden],#splash[hidden],#app[hidden]{display:none!important}
html,body{height:100%}
</style>

<div id="app">
  <div id="map" role="application"></div>
  <button id="menuBtn" class="fab" type="button" data-act="menu"></button>
  <button id="langBtn" class="fab" type="button" data-act="lang"></button>
  <div id="dock">
    <button id="locBtn" class="fab" type="button" data-act="gps"></button>
    <div id="sheet" class="sheet"></div>
  </div>
  <div id="drawer" hidden></div>
  <div id="modal" hidden></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="splash">
    <div class="sp-img" id="spImg"></div>
    <div class="sp-in">
      <span class="logo" id="spLogo"></span>
      <h1 id="spBrand"></h1>
      <p id="spP"></p>
    </div>
  </div>
</div>
<div id="adminRoot" hidden></div>

<script>
/* ===== Data you can edit ===== */
// Landing points. side: E = east bank, W = west bank, I = on the water. lat/lon are approximate.
var POINTS = [
  {id:'corniche', ar:'كورنيش أسوان', en:'Aswan Corniche', lat:24.0880, lon:32.8998, side:'E', lab:'R'},
  {id:'elephantine', ar:'جزيرة الفنتين', en:'Elephantine Island', lat:24.0850, lon:32.8870, side:'I', dx:-4, lab:'L'},
  {id:'kitchener', ar:'جزيرة كيتشنر', en:"Kitchener's Island", lat:24.0795, lon:32.8890, side:'I', dx:6, lab:'R'},
  {id:'tombs', ar:'مقابر النبلاء', en:'Tombs of the Nobles', lat:24.0950, lon:32.8835, side:'W', lab:'L'},
  {id:'simeon', ar:'دير الأنبا سمعان', en:'St Simeon Monastery', lat:24.1000, lon:32.8790, side:'W', lab:'L'},

/* ===== Geometry ===== */
function haversine(a,b){
  var R=6371,rad=Math.PI/180,dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad;
  var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return 2*R*Math.asin(Math.sqrt(h));
}
var LAT0=24.115, YS=3985, MH=Math.round((24.115-23.955)*3985), RW=56;
var CL=[[24.115,236],[24.105,238],[24.095,230],[24.085,226],[24.075,218],[24.062,212],[24.048,206],[24.036,196],[24.028,204],[24.015,212],[24.0,206],[23.985,198],[23.97,192],[23.955,190]];
function yOf(lat){return (LAT0-lat)*YS;}
function cxAt(y){
  var pp=CL.map(function(c){return [yOf(c[0]),c[1]];});
  if(y<=pp[0][0])return pp[0][1];
  for(var i=0;i<pp.length-1;i++){if(y<=pp[i+1][0]){var f=(y-pp[i][0])/(pp[i+1][0]-pp[i][0]);return pp[i][1]+f*(pp[i+1][1]-pp[i][1]);}}
  return pp[pp.length-1][1];
}
function pos(p){
  var y=Math.min(MH-16,Math.max(18,yOf(p.lat))),c=cxAt(y),x=c;
  if(p.side==='E')x=c+RW/2+10;else if(p.side==='W')x=c-RW/2-10;else x=c+(p.dx||0);
  return {x:x,y:y};
}
function pts(path){return path.map(function(q){return q.x.toFixed(1)+','+q.y.toFixed(1);}).join(' ');}
function pathBetween(a,b){
  var mid=[];
  CL.forEach(function(c){var y=yOf(c[0]);if(y>Math.min(a.y,b.y)&&y<Math.max(a.y,b.y))mid.push({x:c[1],y:y});});
  mid.sort(function(u,v){return a.y<b.y?u.y-v.y:v.y-u.y;});
  return [a].concat(mid,[b]);
}
function seg(p,i){return Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);}
function plen(p){var L=0;for(var i=1;i<p.length;i++)L+=seg(p,i);return L;}
function pat(p,f){
  var L=plen(p)*Math.min(1,Math.max(0,f));
  for(var i=1;i<p.length;i++){
    var d=seg(p,i);
    if(L<=d||i===p.length-1){var k=d?Math.min(1,L/d):1;return {x:p[i-1].x+(p[i].x-p[i-1].x)*k,y:p[i-1].y+(p[i].y-p[i-1].y)*k};}
    L-=d;
  }
  return p[p.length-1];
}
function ppoints(p,f){
  var out=[p[0]],L=plen(p)*Math.min(1,Math.max(0,f)),acc=0;
  for(var i=1;i<p.length;i++){
    var d=seg(p,i);
    if(acc+d<=L){out.push(p[i]);acc+=d;}
    else{var k=d?(L-acc)/d:0;out.push({x:p[i-1].x+(p[i].x-p[i-1].x)*k,y:p[i-1].y+(p[i].y-p[i-1].y)*k});break;}
  }
  return pts(out);
}

/* ===== Pricing, boats ===== */
function distKm(a,b){return Math.round(haversine(a,b)*PRICING.riverFactor*10)/10;}
function fare(c,km,size){
  var f=Math.max(PRICING.min,PRICING.base+PRICING.perKm*km);
  if(c.type==='parcel')return r5(f*PRICING.parcelShare)+((PRICING.parcelFee&&PRICING.parcelFee[size])||0);
  return r5(f*c.mult);
}
function speedOf(c){return PRICING.speedKmh*(c.speed||1);}
function tripMins(c,km){return Math.max(1,Math.round(km/speedOf(c)*60));}
function boatsNow(){
  var tt=Date.now()/1000;
  return BOATS.map(function(b,i){return {id:b.id,cls:b.cls,boat:b.boat,captain:b.captain,rating:b.rating,plate:b.plate,lat:b.lat+Math.sin(tt/40+i*2.1)*0.0025};});
}
function boatPos(b){return pos({lat:b.lat,side:'I'});}
function nearestBoat(p,clsId){
  var best=null;
  boatsNow().forEach(function(b){
    if(clsId&&b.cls!==clsId)return;
    var km=Math.max(0.2,haversine({lat:b.lat,lon:p.lon},p)*PRICING.riverFactor);
    if(!best||km<best.km)best={b:b,km:km};
  });
  if(!best)return null;
  var c=clsById(best.b.cls);
  best.eta=Math.round(best.km/speedOf(c)*60)+PRICING.boardingMin;
  return best;
}

}
function mapSVG(){
  var sz=mapSize();PXU=CAM.w/sz.w;
  var s='<svg viewBox="'+[CAM.x,CAM.y,CAM.w,CAM.h].map(function(n){return n.toFixed(2);}).join(' ')+'" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(t('city'))+'">';
  s+='<rect x="-700" y="-700" width="1900" height="2300" style="fill:var(--land)"/>';
  var line=[[CL[0][1],-700]].concat(CL.map(function(c){return [c[1],yOf(c[0])];}),[[CL[CL.length-1][1],1500]]).map(function(q){return q[0]+','+q[1].toFixed(1);}).join(' ');
  s+='<polyline points="'+line+'" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="'+RW+'" style="stroke:var(--water)"/>';
  var eP=byId('elephantine'),kP=byId('kitchener');
  if(eP){var e=pos(eP);s+='<ellipse cx="'+e.x.toFixed(1)+'" cy="'+e.y.toFixed(1)+'" rx="9" ry="22" style="fill:var(--land)"/>';}
  if(kP){var k=pos(kP);s+='<ellipse cx="'+k.x.toFixed(1)+'" cy="'+k.y.toFixed(1)+'" rx="6" ry="11" style="fill:var(--land)"/>';}
  [byId('olddam'),byId('highdam')].forEach(function(d){if(!d)return;var p=pos(d);s+='<rect x="'+(p.x-RW/2-6)+'" y="'+(p.y-3)+'" width="'+(RW+12)+'" height="6" rx="2" style="fill:var(--ink)"/>';});
  var pk=pickup(),dst=dest(),a=pos(pk),me=S.me||a,d2=dst?pos(dst):null;
  var showRoute=d2&&S.screen!=='home'&&S.screen!=='search';
  if(showRoute){
    var rp=pts(pathBetween(a,d2));
    s+='<polyline points="'+rp+'" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="'+(9*PXU).toFixed(2)+'" style="stroke:var(--surface)"/>';
    s+='<polyline points="'+rp+'" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="'+(5*PXU).toFixed(2)+'" style="stroke:var(--ink)"/>';
  }
  if(TR&&(TR.phase==='coming'||TR.phase==='arrived')&&TR.p1){
    s+='<polyline points="'+pts(TR.p1)+'" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="'+(5*PXU).toFixed(2)+'" stroke-dasharray="'+(1*PXU).toFixed(2)+' '+(9*PXU).toFixed(2)+'" style="stroke:var(--accent)"/>';
  }
  if(TR&&TR.phase==='riding'&&TR.p2){
    s+='<polyline id="trDone" points="'+ppoints(TR.p2,TR.f||0)+'" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="'+(5*PXU).toFixed(2)+'" style="stroke:var(--accent)"/>';
  }
  // landing points
  POINTS.forEach(function(p){
    if(p.id===pk.id||(dst&&p.id===dst.id))return;
    var q=pos(p),right=p.lab==='R';
    s+=G(q.x,q.y,'<circle r="15" fill="transparent"/><circle r="6" stroke-width="2.5" style="fill:var(--surface);stroke:var(--accent)"/>'
      +'<text class="m-label" x="'+(right?12:-12)+'" y="4" style="text-anchor:'+(right?'start':'end')+'">'+esc(nm(p))+'</text>','pin" data-pt="'+esc(p.id));
  });
  // idle boats
  boatsNow().forEach(function(b){
    if(TR&&TR.boat&&b.id===TR.boat.id&&(TR.phase==='coming'||TR.phase==='arrived'||TR.phase==='riding'))return;
    var q=boatPos(b);s+=G(q.x,q.y,boatMark(b.cls==='felucca'),'boat-g" data-id="'+b.id);
  });
  // destination
  if(dst){var dq=d2;s+=G(dq.x,dq.y,'<rect x="-9" y="-9" width="18" height="18" rx="3" style="fill:var(--ink)"/><rect x="-3.5" y="-3.5" width="7" height="7" style="fill:var(--surface)"/><text class="m-label m-dest-label" x="14" y="5" style="text-anchor:start">'+esc(nm(dst))+'</text>','dest');}
  // customer
  s+=G(me.x,me.y,'<circle class="pulse" r="'+(S.screen==='finding'?34:20)+'" style="fill:var(--me);opacity:.25"/><circle r="8" stroke-width="3" style="fill:var(--me);stroke:var(--surface)"/>'
    +(S.screen==='home'?'<text class="m-label" y="-16" style="text-anchor:middle">'+esc(nm(pk))+'</text>':''),'me');
  if(S.me){var pp0=pos(pk);s+='<line x1="'+me.x.toFixed(1)+'" y1="'+me.y.toFixed(1)+'" x2="'+pp0.x.toFixed(1)+'" y2="'+pp0.y.toFixed(1)+'" stroke-width="'+(2*PXU).toFixed(2)+'" stroke-dasharray="'+(3*PXU).toFixed(2)+' '+(4*PXU).toFixed(2)+'" style="stroke:var(--me)"/>';}
  // tracked boat
  if(TR&&TR.boat&&TR.cur&&(TR.phase==='coming'||TR.phase==='arrived'||TR.phase==='riding')){
    s+=G(TR.cur.x,TR.cur.y,'<circle r="18" style="fill:var(--surface);stroke:var(--accent)" stroke-width="2.5"/><g transform="scale(1.15)">'+boatMark(TR.cls&&TR.cls.id==='felucca')+'</g>','trk-boat','trBoat');
  }
  return s+'</svg>';
}
function drawMap(){var m=$('map');if(m)m.innerHTML=mapSVG();}
function camFor(ps,minW){
  var sz=mapSize(),top=72,bot=sheetH()+18,vh=Math.max(150,sz.h-top-bot),vw=Math.max(200,sz.w-48);
  var x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;
  ps.forEach(function(p){x0=Math.min(x0,p.x);x1=Math.max(x1,p.x);y0=Math.min(y0,p.y);y1=Math.max(y1,p.y);});
  var s=Math.max((x1-x0)/vw,(y1-y0)/vh,(minW||150)/sz.w);
  s=Math.min(s,2.8);
  var cx=(x0+x1)/2,cy=(y0+y1)/2;
  return {x:cx-(sz.w/2)*s,y:cy-(top+vh/2)*s,w:s*sz.w,h:s*sz.h};
}
function camPoints(){
  var pk=pickup(),a=pos(pk),me=S.me||a,d=dest(),ps=[me];
  if(S.screen==='home'||S.screen==='search'){
    var nb=boatsNow().map(function(b){var q=boatPos(b);return {q:q,d:Math.hypot(q.x-me.x,q.y-me.y)};}).sort(function(u,v){return u.d-v.d;}).slice(0,2);
    nb.forEach(function(n){ps.push(n.q);});
    return {ps:ps,min:150};
  }
  if(d)ps.push(pos(d));
  if(TR&&TR.cur&&(S.screen==='driver'))ps.push(TR.cur);
  if(TR&&TR.cur&&S.screen==='ride')ps.push(TR.cur);
  return {ps:ps,min:130};
}
function setCam(tg,anim){
  if(camAnim){cancelAnimationFrame(camAnim);camAnim=null;}
  if(!anim||reduceMotion()){CAM=tg;drawMap();return;}
  var from={x:CAM.x,y:CAM.y,w:CAM.w,h:CAM.h},t0=performance.now(),D=420;
  function step(now){
    var k=Math.min(1,(now-t0)/D),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    CAM={x:from.x+(tg.x-from.x)*e,y:from.y+(tg.y-from.y)*e,w:from.w+(tg.w-from.w)*e,h:from.h+(tg.h-from.h)*e};
    drawMap();
    camAnim=k<1?requestAnimationFrame(step):null;
  }
  camAnim=requestAnimationFrame(step);
}
function fitCam(anim){
  requestAnimationFrame(function(){var c=camPoints();setCam(camFor(c.ps,c.min),anim);});
}

  PRICING.parcelFee=Object.assign({},DEF_PRICING.parcelFee,(CFG.pricing&&CFG.pricing.parcelFee)||{});

}
function enabledPays(){return ['card','wallet','fawry','cash'].filter(function(m){return !CFG.pay||CFG.pay[m]!==false;});}
function ensurePay(){var e=enabledPays();if(e.length&&e.indexOf(S.pay)<0)S.pay=e[0];}
function loadConfig(){
  return fetch('config.json',{cache:'no-store'}).then(function(r){return r.ok?r.json():{};}).catch(function(){return {};}).then(function(c){
    if(c&&typeof c==='object'){
      ['brand','points','pricing','classes','images','contact','pay','admin'].forEach(function(k){if(c[k]!=null)CFG[k]=c[k];});
      if(c.texts)CFG.texts={ar:c.texts.ar||{},en:c.texts.en||{}};
    }
    applyConfig();buildSplash();
  });
}

/* ===== Location ===== */
function nearestPoint(x,y){
  var best=null;
  POINTS.forEach(function(p){var q=pos(p),d=Math.hypot(q.x-x,q.y-y);if(!best||d<best.d)best={p:p,d:d};});
  return best;
}
function setMe(x,y){
  var b=nearestPoint(x,y);
  S.me={x:x,y:y};S.from=b.p.id;
  if(S.to===S.from)S.to=null;
  toast(t('tap_set')+' '+nm(b.p));
  if(S.screen==='search')S.screen='home';
  go('home');
}
function locate(){
  if(!navigator.geolocation){toast(t('loc_fail'));return;}
  toast(t('loc_wait'));
  try{
    navigator.geolocation.getCurrentPosition(function(g){
      var me={lat:g.coords.latitude,lon:g.coords.longitude},best=null;
      POINTS.forEach(function(p){var d=haversine(me,p);if(!best||d<best.d)best={p:p,d:d};});
      if(!best||best.d>20){toast(t('loc_far'));return;}
      var y=Math.min(MH-16,Math.max(18,yOf(me.lat))),sign=me.lon>=best.p.lon?1:-1;
      S.me={x:cxAt(y)+sign*(RW/2+22),y:y};S.from=best.p.id;
      if(S.to===S.from)S.to=null;
      toast(t('loc_ok')+' '+nm(best.p)+' ('+best.d.toFixed(1)+' '+t('km')+')');
      go(S.to&&S.screen!=='home'?'options':'home');
    },function(){toast(t('loc_fail'));},{enableHighAccuracy:true,timeout:10000,maximumAge:30000});
  }catch(e){toast(t('loc_fail'));}
}

/* ===== Trip simulation ===== */
function stopTracking(){
  if(trTimer){clearInterval(trTimer);trTimer=null;}
  if(TR&&TR.timer)clearTimeout(TR.timer);
  TR=null;
}
function startFinding(){
  var c=clsById(S.cls),a=pickup(),d=dest(),km=distKm(a,d);
  stopTracking();
  TR={phase:'finding',cls:c,km2:km,price:fare(c,km,S.size),size:S.size,from:a,to:d,pay:S.pay,pin:String(1000+Math.floor(Math.random()*9000)),fawry:String(Math.floor(1e8+Math.random()*9e8)),f:0};
  go('finding');
  TR.timer=setTimeout(assignBoat,2600);
}
function assignBoat(){
  if(!TR||TR.phase!=='finding')return;
  var a=TR.from,nb=nearestBoat(a,boatClsOf(TR.cls));
  if(!nb){toast(t('unavail'));stopTracking();go('options');return;}
  var bp=boatPos(nb.b),pa=pos(a),pd=pos(TR.to),sp=speedOf(TR.cls);
  Object.assign(TR,{phase:'coming',boat:nb.b,t0:Date.now(),p1:pathBetween(bp,pa),km1:nb.km,p2:pathBetween(pa,pd),
    dur1:Math.max(8000,nb.km/sp*3600000/SIMX),dur2:Math.max(12000,TR.km2/sp*3600000/SIMX),cur:bp,remKm:nb.km,remMin:nb.km/sp*60,sp:sp});
  trTimer=setInterval(trackTick,400);
  go('driver');
}
function trackTick(){
  if(!TR||TR.phase==='finding'||TR.phase==='done')return;
  var now=Date.now(),f=0,path=TR.p1,rk=0,rm=0;
  if(TR.phase==='coming'){
    f=Math.min(1,(now-TR.t0)/TR.dur1);rk=TR.km1*(1-f);rm=TR.km1/TR.sp*60*(1-f);
    if(f>=1){TR.phase='arrived';TR.tA=now;TR.f=1;go('driver');return;}
  }else if(TR.phase==='arrived'){
    f=1;
    if(now-TR.tA>=6000){beginRide();return;}
  }else if(TR.phase==='riding'){
    path=TR.p2;f=Math.min(1,(now-TR.t2)/TR.dur2);rk=TR.km2*(1-f);rm=TR.km2/TR.sp*60*(1-f);
    if(f>=1){finishRide();return;}
  }
  TR.f=f;TR.path=path;TR.remKm=rk;TR.remMin=rm;
  paintTrack();
}
function beginRide(){TR.phase='riding';TR.t2=Date.now();TR.f=0;TR.path=TR.p2;TR.remKm=TR.km2;TR.remMin=TR.km2/TR.sp*60;go('ride');}
function finishRide(){
  TR.phase='done';TR.f=1;TR.cur=pat(TR.p2,1);
  if(trTimer){clearInterval(trTimer);trTimer=null;}
  S.rating=0;S.tip=0;S.quickOpen=false;
  go('rate');
}
function paintTrack(){
  if(!TR||TR.phase==='finding')return;
  var path=TR.path||TR.p1,pt=pat(path,TR.f);
  TR.cur=pt;
  var bt=$('trBoat');if(bt)bt.setAttribute('transform','translate('+pt.x.toFixed(1)+' '+pt.y.toFixed(1)+') scale('+PXU.toFixed(3)+')');
  var dn=$('trDone');if(dn&&TR.p2)dn.setAttribute('points',ppoints(TR.p2,TR.f));
  var bar=$('bar');if(bar)bar.style.width=Math.round(TR.f*100)+'%';
  var el;
  if(TR.phase==='coming'){el=$('etaBig');if(el)el.textContent=t('arrives_in')+' '+Math.max(1,Math.ceil(TR.remMin)+PRICING.boardingMin)+' '+t('min');}
  if(TR.phase==='arrived'){el=$('startIn');if(el)el.textContent=t('start_in')+' '+Math.max(0,Math.ceil(6-(Date.now()-TR.tA)/1000))+' '+t('sec');}
  if(TR.phase==='riding'){
    el=$('arrTime');if(el)el.textContent=t('arrival_at')+' '+clock(Date.now()+TR.remMin*60000);
    el=$('remKm');if(el)el.textContent=TR.remKm.toFixed(1)+' '+t('km');
    el=$('remMin');if(el)el.textContent=Math.max(1,Math.ceil(TR.remMin))+' '+t('min');
  }
}
function cancelTrip(){
  stopTracking();S.quickOpen=false;toast(t('cancelled'));
  go(S.to?'options':'home');
}
function moveBoats(){
  var bs=boatsNow(),g=document.querySelectorAll('.boat-g');
  for(var i=0;i<g.length;i++){
    var id=g[i].getAttribute('data-id');
    for(var j=0;j<bs.length;j++)if(bs[j].id===id){var q=boatPos(bs[j]);g[i].setAttribute('transform','translate('+q.x.toFixed(1)+' '+q.y.toFixed(1)+') scale('+PXU.toFixed(3)+')');}
  }
}

function savePay(){
  var err=$('pmErr'),m=S.pay;
  if(m==='card'&&(!S.card||S.cardEdit)){
    var n=digits(($('pmCardNo')||{}).value||''),ex=(($('pmExp')||{}).value||''),cv=(($('pmCvv')||{}).value||'');
    if(n.length<13||n.length>19){err.textContent=t('e_card');return;}
    if(!/^(0[1-9]|1[0-2])\/\d\d$/.test(ex)){err.textContent=t('e_exp');return;}
    if(!/^\d{3,4}$/.test(cv)){err.textContent=t('e_cvv');return;}
    S.card={last4:n.slice(-4)};S.cardEdit=false;   // only the last four digits are kept, in memory
  }
  if(m==='wallet'&&(!S.wallet||S.walletEdit)){
    var w=digits(($('pmWallet')||{}).value||'');
    if(!/^01\d{9}$/.test(w)){err.textContent=t('e_wallet');return;}
    S.wallet={last4:w.slice(-4)};S.walletEdit=false;
  }
  var again=S.afterPay;
  closeModal();renderSheet();
  if(again)startFinding();
}

  if((S.pay==='card'&&!S.card)||(S.pay==='wallet'&&!S.wallet)){S.afterPay=true;payModal();toast(t('pay_needed'));return;}
  startFinding();
}

/* ===== Actions ===== */
function act(a,id){
  switch(a){
    case 'menu':openDrawer();break;
    case 'drawer-close':closeDrawer();break;
    case 'search':S.mode='dest';S.q='';go('search');break;
    case 'pickup':S.mode='pickup';S.q='';go('search');break;
    case 'home':if(S.screen==='search'){go(S.to?'options':'home');}else{S.to=null;go('home');}break;
    case 'tour':{var tr=TOURS.filter(function(x){return x.id===id;})[0];if(tr){if(tr.to===S.from){toast(t('same_pt'));break;}S.to=tr.to;if(clsById(tr.cls))S.cls=tr.cls;go('options');}break;}
    case 'dest':if(id===S.from){toast(t('same_pt'));break;}S.to=id;go('options');break;
    case 'setpickup':S.from=id;S.me=null;if(S.to===S.from)S.to=null;go(S.to?'options':'home');break;
    case 'gps':locate();break;
    case 'cls':S.cls=id;renderSheet();break;
    case 'size':S.size=id;renderSheet();break;
    case 'pay':S.afterPay=false;payModal();break;
    case 'paymodal':closeDrawer();S.afterPay=false;payModal();break;
    case 'pm':S.pay=id;payModal();break;
    case 'pm-edit':if(S.pay==='card')S.cardEdit=true;else S.walletEdit=true;payModal();break;
    case 'pm-save':savePay();break;
    case 'modal-close':closeModal();renderSheet();break;
    case 'confirm':confirmRide();break;
    case 'cancel':cancelTrip();break;
    case 'startnow':if(TR&&TR.phase==='arrived')beginRide();break;
    case 'msg':S.quickOpen=!S.quickOpen;renderSheet();break;
    case 'quick':S.quickOpen=false;renderSheet();toast(t('sent'));break;
    case 'star':S.rating=parseInt(id,10);renderSheet();break;
    case 'tip':S.tip=parseInt(id,10);renderSheet();break;
    case 'finish':
      saveTrip({ts:Date.now(),from:TR.from.id,to:TR.to.id,cls:TR.cls.id,km:TR.km2,total:totalNow(),rating:S.rating});
      stopTracking();S.to=null;S.rating=0;S.tip=0;go('home');break;
    case 'trips':closeDrawer();tripsModal();break;
    case 'help':closeDrawer();helpModal();break;
    case 'lang':S.lang=S.lang==='ar'?'en':'ar';closeDrawer();applyLang();break;
    case 'admin':closeDrawer();location.hash='admin';break;
  }
}
function bindApp(){
  var app=$('app');
  app.addEventListener('click',function(ev){
    var el=ev.target.closest?ev.target.closest('[data-act]'):null;
    if(el){act(el.getAttribute('data-act'),el.getAttribute('data-id'));return;}
    var pin=ev.target.closest?ev.target.closest('[data-pt]'):null;
    if(pin&&(S.screen==='home'||S.screen==='search'||S.screen==='options')){
      var id=pin.getAttribute('data-pt');
      if(S.screen==='search'&&S.mode==='pickup')act('setpickup',id);else act('dest',id);
      return;
    }
    if(S.screen==='home'&&ev.target.closest&&ev.target.closest('#map')){
      var sv=$('map').querySelector('svg');if(!sv)return;
      var ctm=sv.getScreenCTM();if(!ctm)return;
      var p=sv.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;
      var q=p.matrixTransform(ctm.inverse());setMe(q.x,q.y);
    }
  });
  app.addEventListener('input',function(ev){
    var id=ev.target.id;
    if(id==='q'){S.q=ev.target.value;var pk=S.mode==='pickup';$('plist').innerHTML=placeItems(sortedPoints(pk?(dest()||pickup()):pickup(),S.q),pk?'setpickup':'dest');}
    else if(id==='pmCardNo')ev.target.value=digits(ev.target.value).slice(0,19).replace(/(.{4})/g,'$1 ').trim();
    else if(id==='pmExp'){var d=digits(ev.target.value).slice(0,4);ev.target.value=d.length>2?d.slice(0,2)+'/'+d.slice(2):d;}
    else if(id==='pmCvv')ev.target.value=digits(ev.target.value).slice(0,4);
    else if(id==='pmWallet')ev.target.value=digits(ev.target.value).slice(0,11);
  });
  window.addEventListener('resize',function(){fitCam(false);});
  setInterval(liveTick,1500);
}

function sha(str){

    return crypto.subtle.digest('SHA-256',new TextEncoder().encode(str)).then(function(buf){

/* save */
function shrink(file,square){
  return new Promise(function(res,rej){
    var rd=new FileReader();rd.onerror=rej;
    rd.onload=function(){
      var im=new Image();im.onerror=rej;
      im.onload=function(){
        var c=document.createElement('canvas'),x,k,sw=im.width,sh=im.height,sx=0,sy=0;
        if(square){var m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=m;sh=m;c.width=c.height=Math.min(256,m);}
        else{k=Math.min(1,1600/Math.max(sw,sh));c.width=Math.max(1,Math.round(sw*k));c.height=Math.max(1,Math.round(sh*k));}
        x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,sx,sy,sw,sh,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.82));
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(file);
  });
}
function buildClean(){
  var pts0=D.points,ids={},outPts=[],i;
  if(pts0.length<2)return {err:'v_points'};
  for(i=0;i<pts0.length;i++){
    var p=pts0[i];
    if(!String(p.ar||'').trim()||!String(p.en||'').trim())return {err:'v_name'};
    if(typeof p.lat!=='number'||typeof p.lon!=='number'||!isFinite(p.lat)||!isFinite(p.lon)||p.lat<23.5||p.lat>24.5||p.lon<32.5||p.lon>33.2)return {err:'v_coord'};
    var id=p.id||('p'+Date.now().toString(36)+i);while(ids[id])id+='x';ids[id]=1;
    outPts.push({id:id,ar:String(p.ar).trim(),en:String(p.en).trim(),lat:p.lat,lon:p.lon,side:p.side||'E',lab:p.lab||'R',dx:p.dx||0});
  }
  var pr=D.pricing,op={},keys=['base','perKm','min','riverFactor','speedKmh','boardingMin','parcelShare'];
  for(i=0;i<keys.length;i++){var v=pr[keys[i]];if(typeof v!=='number'||!isFinite(v)||v<0)return {err:'v_num'};op[keys[i]]=v;}
  if(op.speedKmh<=0||op.riverFactor<=0)return {err:'v_num'};
  op.parcelFee={};
  ['s','m','l'].forEach(function(k){op.parcelFee[k]=pr.parcelFee[k];});
  for(var k in op.parcelFee){if(typeof op.parcelFee[k]!=='number'||!isFinite(op.parcelFee[k])||op.parcelFee[k]<0)return {err:'v_num'};}
  var outCl=[];
  for(i=0;i<D.classes.length;i++){
    var c=D.classes[i];
    if(!String(c.ar||'').trim()||!String(c.en||'').trim())return {err:'v_name'};
    if(typeof c.mult!=='number'||!isFinite(c.mult)||c.mult<=0||typeof c.speed!=='number'||!isFinite(c.speed)||c.speed<=0)return {err:'v_num'};
    if(c.type!=='parcel'&&(typeof c.cap!=='number'||!isFinite(c.cap)||c.cap<1))return {err:'v_num'};
    outCl.push({id:c.id,ar:String(c.ar).trim(),en:String(c.en).trim(),cap:c.type==='parcel'?0:Math.round(c.cap),mult:c.mult,speed:c.speed,type:c.type});
  }
  var tx={ar:{},en:{}};
  ['ar','en'].forEach(function(l){Object.keys(D.texts[l]||{}).forEach(function(k){var v=D.texts[l][k];if(LANG[l][k]!==undefined&&v!==LANG[l][k]&&String(v).trim()!=='')tx[l][k]=v;});});
  var ct=D.contact||{};
  return {cfg:{version:2,brand:(D.brand||'').trim()||'Boat delivery',points:outPts,pricing:op,classes:outCl,texts:tx,images:clone(D.images||{}),
    contact:{whatsapp:String(ct.whatsapp||'').trim(),phone:String(ct.phone||'').trim(),email:String(ct.email||'').trim()},
    pay:{card:D.pay.card!==false,wallet:D.pay.wallet!==false,fawry:D.pay.fawry!==false,cash:D.pay.cash!==false},admin:CFG.admin||null}};
}
function errText(e){

  if(c==='not_writer'||c==='not_granted'||c==='consent_required'||c==='not_declared')return ad('e_notwriter');
  if(c==='capability_disabled'||c==='capability_removed')return ad('e_disabled');
  if(c==='rate_limited')return ad('e_rate');
  if(c==='conflict')return ad('e_conflict');
  if(c==='too_large')return ad('e_big');
  return ad('e_gen');
}

  }).then(function(){

function save(){
  var r=buildClean();if(r.err){msg(ad(r.err),true);return;}
  var sec=D.sec,cur=getAdmin(),u=String(sec.user||'').trim()||cur.user,p;
  if(sec.pass||sec.pass2){
    if(sec.pass.length<8){msg(ad('s_short'),true);return;}
    if(sec.pass!==sec.pass2){msg(ad('s_mismatch'),true);return;}
    var salt='s'+Math.random().toString(36).slice(2,8);
    p=sha(salt+'|'+sec.pass).then(function(h){return {user:u,salt:salt,hash:h};});
  }else if(u!==cur.user){p=Promise.resolve({user:u,salt:cur.salt,hash:cur.hash});}
  else p=Promise.resolve(CFG.admin||null);
  msg('...');

}
function doLogin(){
  var u=$('aUser').value.trim(),pw=$('aPass').value,a=getAdmin(),err=$('aErr');
  sha(a.salt+'|'+pw).then(function(h){
    if(u===a.user&&h===a.hash){adminOn=true;D=newDraft(CFG);dirty=false;tab='points';getPub();renderPanel();}
    else err.textContent=ad('bad');
  }).catch(function(){err.textContent=ad('nocrypto');});
}
function onField(ev){
  var el=ev.target;
  if(!el||!el.getAttribute)return;
  if(el.hasAttribute('data-img')){
    if(ev.type!=='change')return;
    var f=el.files&&el.files[0];if(!f)return;
    if(!/^image\//.test(f.type)){msg(ad('im_bad'),true);return;}
    var key=el.getAttribute('data-img');
    shrink(f,key==='logo').then(function(url){D.images[key]=url;markDirty();renderPanel();}).catch(function(){msg(ad('im_bad'),true);});
    return;
  }
  var path=el.getAttribute('data-f');if(!path)return;
  var v;
  if(el.type==='checkbox')v=el.checked;
  else if(el.type==='number')v=el.value===''?NaN:parseFloat(el.value);
  else v=el.value;
  setPath(D,path,v);markDirty();
}
function bindAdmin(){
  var r=root();
  r.addEventListener('submit',function(ev){if(ev.target.id==='loginForm'){ev.preventDefault();doLogin();}});
  r.addEventListener('click',function(ev){
    var b=ev.target.closest?ev.target.closest('[data-act],[data-tab]'):null;if(!b)return;
    if(b.hasAttribute('data-tab')){tab=b.getAttribute('data-tab');renderPanel();return;}
    var a=b.getAttribute('data-act');
    if(a==='back'){location.hash='';showSite();}
    else if(a==='logout'){adminOn=false;D=null;dirty=false;renderLogin();}
    else if(a==='lang'){S.lang=S.lang==='ar'?'en':'ar';applyLang();}
    else if(a==='save')save();
    else if(a==='add-point'){D.points.push({id:'p'+Date.now().toString(36),ar:'',en:'',lat:24.0880,lon:32.8998,side:'E',lab:'R',dx:0});markDirty();renderPanel();}
    else if(a==='del-point'){if(D.points.length>2){D.points.splice(parseInt(b.getAttribute('data-i'),10),1);markDirty();renderPanel();}}
    else if(a==='img-clear'){delete D.images[b.getAttribute('data-k')];markDirty();renderPanel();}
    else if(a==='reset'){var keep=CFG.admin;D=newDraft({admin:keep});markDirty();renderPanel();msg(ad('reset_done'));}
  });
  r.addEventListener('input',onField);
  r.addEventListener('change',onField);
  window.addEventListener('hashchange',route);
}

/* ===== Boot ===== */
bindApp();
bindAdmin();
$('menuBtn').innerHTML=ic('menu');
$('locBtn').innerHTML=ic('locate');
$('splash').addEventListener('click',hideSplash);
buildSplash();
applyConfig();
S.screen='home';
route();
if(location.hash!=='#admin')setTimeout(hideSplash,2400);
loadConfig();
</script>
</body></html>
